<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跳高小游戏 · High Jump</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrap">
    <h1 class="title">跳高小游戏</h1>
    <div class="canvas-box">
      <canvas id="game" width="800" height="480"></canvas>
    </div>
    <p class="hint">按 <kbd>空格</kbd> 或 <kbd>点击画面</kbd> 起跳 · 在合适的时机越过横杆</p>
    <p class="subhint">每过一关横杆都会升高，看看你能跳多高！</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
